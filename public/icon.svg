<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="104" fill="#09090b"/>
  <circle cx="256" cy="256" r="210" fill="none" stroke="#27272a" stroke-width="2" stroke-dasharray="4 8"/>
  <circle cx="256" cy="256" r="160" fill="#121215" stroke="#3f3f46" stroke-width="1.5"/>
  
  <!-- 4-Stem Quadrant Glyphs -->
  <!-- Top: DRUMS (White) -->
  <circle cx="256" cy="156" r="14" fill="#f4f4f5"/>
  <circle cx="256" cy="156" r="22" fill="none" stroke="#f4f4f5" stroke-width="1.5" opacity="0.4"/>
  <!-- Right: BASS (Cool Blue) -->
  <circle cx="356" cy="256" r="14" fill="#38bdf8"/>
  <circle cx="356" cy="256" r="22" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.4"/>
  <!-- Bottom: MUSIC (Mint Green) -->
  <circle cx="256" cy="356" r="14" fill="#4ade80"/>
  <circle cx="256" cy="356" r="22" fill="none" stroke="#4ade80" stroke-width="1.5" opacity="0.4"/>
  <!-- Left: VOCAL (Warm Peach) -->
  <circle cx="156" cy="256" r="14" fill="#fb923c"/>
  <circle cx="156" cy="256" r="22" fill="none" stroke="#fb923c" stroke-width="1.5" opacity="0.4"/>

  <!-- Center Dot Matrix Core -->
  <circle cx="256" cy="256" r="28" fill="#18181b" stroke="#e4e4e7" stroke-width="2"/>
  <circle cx="256" cy="256" r="8" fill="#ef4444"/>
  <line x1="256" y1="188" x2="256" y2="220" stroke="#71717a" stroke-width="2"/>
  <line x1="256" y1="292" x2="256" y2="324" stroke="#71717a" stroke-width="2"/>
  <line x1="188" y1="256" x2="220" y2="256" stroke="#71717a" stroke-width="2"/>
  <line x1="292" y1="256" x2="324" y2="256" stroke="#71717a" stroke-width="2"/>
</svg>
